apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: trainingruns.training.kcc.io
spec:
  group: training.kcc.io
  scope: Namespaced
  names:
    plural: trainingruns
    singular: trainingrun
    kind: TrainingRun
    shortNames: [trun]
  versions:
    - name: v1beta1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Phase, type: string, jsonPath: .status.phase}
        - {name: Attempt, type: integer, jsonPath: .status.attempt}
        - {name: Output, type: string, jsonPath: .status.outputArtifact}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [runtimeProfile, recipe, workers, recovery]
              x-kubernetes-validations:
                - rule: >-
                    (self.recovery.maxReplacements + 1) *
                    (self.recovery.sameTopologyRetries + 1) <= 100
                  message: total recovery attempt budget must not exceed 100
                - rule: >-
                    self.runtimeProfile == oldSelf.runtimeProfile &&
                    self.recipe == oldSelf.recipe &&
                    self.workers == oldSelf.workers &&
                    self.recovery == oldSelf.recovery
                  message: runtimeProfile, recipe, workers, and recovery are immutable; only suspend and suspendMode may change
              properties:
                runtimeProfile:
                  type: string
                  pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                  maxLength: 63
                recipe:
                  type: string
                  pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                  maxLength: 63
                workers: {type: integer, minimum: 1, maximum: 1024}
                suspend: {type: boolean, default: false}
                suspendMode:
                  type: string
                  enum: [Immediate, AfterCheckpoint]
                  default: Immediate
                recovery:
                  type: object
                  required: [sameTopologyRetries, maxReplacements, noProgressSeconds]
                  properties:
                    sameTopologyRetries: {type: integer, minimum: 0, maximum: 10}
                    maxReplacements: {type: integer, minimum: 0, maximum: 100}
                    noProgressSeconds: {type: integer, minimum: 0}
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Starting, Running, Stopping, Recovering, Suspended, Succeeded, Stopped, ManualRequired]
                observedGeneration: {type: integer, minimum: 1}
                attempt: {type: integer, minimum: 0}
                activeNodes:
                  type: array
                  items: {type: string}
                spareNodes:
                  type: array
                  items: {type: string}
                clusterName: {type: string}
                cleanupClusterName: {type: string}
                rayAddress: {type: string}
                submissionId: {type: string}
                retriesUsed: {type: integer, minimum: 0}
                replacementsUsed: {type: integer, minimum: 0}
                suspendedFrom: {type: string}
                stopRequestGeneration: {type: integer, minimum: 1}
                stopRequestedAt: {type: string}
                stopBaselineIteration: {type: integer, minimum: 0}
                startTime: {type: string}
                runningStartedAt: {type: string}
                resultWaitStartedAt: {type: string}
                completionTime: {type: string}
                updatedAt: {type: string}
                outputArtifact:
                  type: string
                  pattern: '^artifact://[^/?#\s]+/[^/?#\s]+/[^/?#\s]+$'
                checkpoint:
                  type: object
                  nullable: true
                  properties:
                    available: {type: boolean}
                    iteration: {type: integer, minimum: 1}
                    trackerSha256: {type: string, pattern: '^[0-9a-f]{64}$'}
                    snapshotSha256: {type: string, pattern: '^[0-9a-f]{64}$'}
                    selectedDir: {type: string}
                    fileCount: {type: integer, minimum: 1}
                    totalBytes: {type: integer, minimum: 1}
                    hashMode: {type: string, enum: [sampled-v1]}
                    sampleBytesPerFile: {type: integer, minimum: 1}
                diagnosis:
                  type: object
                  properties:
                    reportedFailedNodes:
                      type: array
                      items: {type: string}
                    failedNodes:
                      type: array
                      items: {type: string}
                    healthySpareNodes:
                      type: array
                      items: {type: string}
                    consecutive: {type: integer, minimum: 0}
                    observedAt: {type: string}
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type: {type: string, minLength: 1}
                      status: {type: string, enum: ['True', 'False', Unknown]}
                      reason: {type: string, minLength: 1}
                      message: {type: string}
                      lastTransitionTime: {type: string}

