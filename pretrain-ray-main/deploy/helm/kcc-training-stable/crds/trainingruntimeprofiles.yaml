apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: trainingruntimeprofiles.training.kcc.io
spec:
  group: training.kcc.io
  scope: Namespaced
  names:
    plural: trainingruntimeprofiles
    singular: trainingruntimeprofile
    kind: TrainingRuntimeProfile
    shortNames: [trp]
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              additionalProperties: false
              required: [images, rayVersion, accelerator, workspace, scheduling, integrations]
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: TrainingRuntimeProfile spec is immutable; publish a new named profile version
                - rule: >-
                    !self.scheduling.activeNodes.exists(
                      active, self.scheduling.spareNodes.exists(spare, spare == active)
                    )
                  message: activeNodes and spareNodes must be disjoint
              properties:
                images:
                  type: object
                  additionalProperties: false
                  required: [head, worker]
                  properties:
                    head: {type: string, pattern: '^[A-Za-z0-9._:/-]+@sha256:[0-9a-f]{64}$'}
                    worker: {type: string, pattern: '^[A-Za-z0-9._:/-]+@sha256:[0-9a-f]{64}$'}
                    pullSecrets:
                      type: array
                      default: []
                      uniqueItems: true
                      items:
                        type: string
                        minLength: 1
                        maxLength: 253
                        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                rayVersion: {type: string, minLength: 1}
                accelerator:
                  type: object
                  additionalProperties: false
                  required: [resourceName, devicesPerNode]
                  properties:
                    resourceName: {type: string, minLength: 1}
                    devicesPerNode: {type: integer, minimum: 1, maximum: 64}
                    runtimeClassName:
                      type: string
                      minLength: 1
                      maxLength: 63
                      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                workspace:
                  type: object
                  additionalProperties: false
                  required: [claimName, mountPath]
                  properties:
                    claimName:
                      type: string
                      minLength: 1
                      maxLength: 63
                      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                    mountPath: {type: string, pattern: '^/'}
                scheduling:
                  type: object
                  additionalProperties: false
                  required: [activeNodes, spareNodes, headSelector, workerSelector]
                  properties:
                    activeNodes:
                      type: array
                      minItems: 1
                      uniqueItems: true
                      items: {type: string, minLength: 1}
                    spareNodes:
                      type: array
                      uniqueItems: true
                      items: {type: string, minLength: 1}
                    headSelector:
                      type: object
                      additionalProperties: {type: string}
                    workerSelector:
                      type: object
                      additionalProperties: {type: string}
                integrations:
                  type: object
                  additionalProperties: false
                  required: [rankTableProvider, healthProvider]
                  properties:
                    rankTableProvider: {type: string, enum: [clusterd]}
                    healthProvider: {type: string, enum: [npu-exporter, kubernetes]}
                podTemplate:
                  type: object
                  additionalProperties: false
                  properties:
                    head:
                      type: object
                      additionalProperties: false
                      properties:
                        resources:
                          type: object
                          additionalProperties: false
                          required: [requests, limits]
                          properties:
                            requests:
                              type: object
                              additionalProperties:
                                anyOf:
                                  - type: integer
                                  - type: string
                                x-kubernetes-int-or-string: true
                            limits:
                              type: object
                              additionalProperties:
                                anyOf:
                                  - type: integer
                                  - type: string
                                x-kubernetes-int-or-string: true
                        tolerations:
                          type: array
                          items:
                            type: object
                            additionalProperties: false
                            properties:
                              key: {type: string}
                              operator: {type: string, enum: [Exists, Equal]}
                              value: {type: string}
                              effect: {type: string, enum: [NoSchedule, PreferNoSchedule, NoExecute]}
                              tolerationSeconds: {type: integer, minimum: 0}
                        priorityClassName: {type: string, minLength: 1}
                        rayCpus: {type: integer, minimum: 1}
                    worker:
                      type: object
                      additionalProperties: false
                      properties:
                        resources:
                          type: object
                          additionalProperties: false
                          required: [requests, limits]
                          properties:
                            requests:
                              type: object
                              additionalProperties:
                                anyOf:
                                  - type: integer
                                  - type: string
                                x-kubernetes-int-or-string: true
                            limits:
                              type: object
                              additionalProperties:
                                anyOf:
                                  - type: integer
                                  - type: string
                                x-kubernetes-int-or-string: true
                        tolerations:
                          type: array
                          items:
                            type: object
                            additionalProperties: false
                            properties:
                              key: {type: string}
                              operator: {type: string, enum: [Exists, Equal]}
                              value: {type: string}
                              effect: {type: string, enum: [NoSchedule, PreferNoSchedule, NoExecute]}
                              tolerationSeconds: {type: integer, minimum: 0}
                        priorityClassName: {type: string, minLength: 1}
                        rayCpus: {type: integer, minimum: 1}

